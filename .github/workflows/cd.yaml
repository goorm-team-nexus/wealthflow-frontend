name: CD

on:
  workflow_call:
    inputs:
      namespace:
        required: false
        type: string
        default: ""
      image_tag:
        required: true
        type: string
      image_alias:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      namespace:
        description: Optional Kubernetes namespace override
        required: false
        type: string
        default: ""
      image_tag:
        description: Docker image tag to publish
        required: true
        type: string
      image_alias:
        description: Optional additional Docker image tag
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      K8S_NAMESPACE: ${{ inputs.namespace || vars.K8S_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment inputs
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          : "${AWS_REGION:?AWS_REGION repository or environment variable is required}"
          : "${ECR_REPOSITORY:?ECR_REPOSITORY repository or environment variable is required}"
          : "${EKS_CLUSTER_NAME:?EKS_CLUSTER_NAME repository or environment variable is required}"
          : "${K8S_NAMESPACE:?K8S_NAMESPACE environment variable or namespace input is required}"
          : "${IMAGE_TAG:?image_tag input is required}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_ALIAS: ${{ inputs.image_alias }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          tags="${image_uri}"

          if [ -n "${IMAGE_ALIAS}" ]; then
            tags="${tags}"$'\n'"${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_ALIAS}"
          fi

          {
            echo "uri=${image_uri}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${{ vars.NEXT_PUBLIC_CLOUDFRONT_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Render Kubernetes deployment
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          : "${IMAGE_URI:?image URI is required}"
          grep -q 'IMAGE_PLACEHOLDER' k8s/deployment.yaml
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            k8s/deployment.yaml > /tmp/wealthflow-frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -n "${K8S_NAMESPACE}" -f /tmp/wealthflow-frontend-deployment.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/wealthflow-frontend \
            -n "${K8S_NAMESPACE}"
