name: CI/CD

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-cd-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  cd:
    needs: ci
    uses: ./.github/workflows/cd.yaml
    with:
      image_tag: sha-${{ github.sha }}
      image_alias: ${{ github.ref_name }}-latest
    secrets: inherit
